on:
  # On push to these branches
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/**'

  # On pull request
  pull_request:
    branches: [main]

  # On schedule (cron)
  schedule:
    - cron: '0 9 * * 1-5'  # Weekdays at 9 AM

  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Database service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
        ports:
          - 5432:5432

    steps:
    # Using marketplace actions
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '/package-lock.json'
    
    # Running shell commands
    - name: Install dependencies
      run: npm ci
    
    # Conditional steps
    - name: Deploy
      if: github.ref == 'refs/heads/main'
      run: npm run deploy
    
    # Matrix strategy
    strategy:
      matrix:
        node-version: [18, 20]
